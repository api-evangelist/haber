name: Haber
description: 'Haber (Elixa Technologies Private Limited), headquartered in Pune, India with a
  US presence in Chicago, is an industrial AI company delivering AI-led automation for smart
  manufacturing across heavy industries including pulp, paper, packaging and tissue, metals and
  mining, food and beverages, oil and gas, and water/utility institutions. Its product suite
  spans eLIXA, an IIoT-powered process intelligence platform; Mt. Fuji for historical data
  storage, visualizations, digital twins and predictive interventions; Kaiznn, an optimization
  engine for trim-loss reduction, inventory and production scheduling; plus Kensei and FiMorph.
  The platform emphasizes real-time monitoring, predictive analytics, and enterprise-grade
  security (SOC 2 Type 2, ISO/IEC 27001:2022). Surfaced as a portfolio company of Accel and
  enriched into the API Evangelist network.'
